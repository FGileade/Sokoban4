name: Build GBA ROM (Butano)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          apt-get update
          apt-get install -y git python3 python3-pip python3-pil

      - name: Baixar Butano
        run: git clone --depth 1 --branch 21.10.1 https://github.com/GValiente/butano.git butano

      - name: Gerar assets
        run: python3 tools/generate_assets.py

      - name: Validar BMP e JSON
        run: python3 tools/validate_assets.py

      - name: Verificar camaras (BFS)
        run: python3 tools/solve_verify.py

      - name: Compilar ROM
        run: make -j2 2>&1 | tee build.log

      - name: Auditar ROM
        run: python3 tools/rom_audit.py sokoban4.gba build/sokoban4.elf | tee rom_report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sokoban4-gba-rom
          path: |
            sokoban4.gba
            build.log
            rom_report.txt
